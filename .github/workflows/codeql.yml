# CodeQL security analysis for hermes-agent.
#
# Scope:
#   - queries: the CodeQL DEFAULT suite. We deliberately do not enable
#     security-extended or security-and-quality.
#
#     This workflow previously set security-extended on the theory that
#     it stayed "CVE-class". Measured on this repo, that was wrong: it
#     added 266 alerts in one scan, entirely in precision-medium
#     heuristic families -- py/log-injection (161),
#     py/shell-command-constructed-from-input (30),
#     py/overly-permissive-file (25), js/insecure-temporary-file (14),
#     js/log-injection (13), js/file-system-race (7). Spot-checks were
#     false positives: a debug log of a mkstemp temp filename inside
#     utils.atomic_replace, and tools/url_safety.py logging the very
#     hostname it was about to block. Generic helpers (atomic_write_text,
#     kanban_db, profiles) are called from hundreds of sites, so one
#     flagged sink fans out into hundreds of alerts -- 1427 alerts over
#     246 files, 39% of them in just 12 files. That volume buries real
#     findings instead of surfacing them.
#   - languages: python, javascript (TypeScript is bundled into the JS
#     analysis per CodeQL docs), actions, rust, and c-cpp.
#     rust covers apps/bootstrap-installer/src-tauri; c-cpp covers the
#     SQLite FTS5 extension in native/fts5_cjk (its vendored amalgamation
#     is excluded via .github/codeql/codeql-config.yml so third-party
#     SQLite source doesn't drown the real findings).
#     actions is analyzed rather than delegated to supply-chain-audit.yml:
#     SHA pinning does not address `${{ }}` expression injection or
#     `run:` script issues, and that workflow explicitly dropped the
#     workflow-edit / action-unpinning heuristics.
#
# Triggers:
#   - pull_request to main -- reviews a change BEFORE it merges, which is
#     the only point where a finding is cheap to act on. Without this the
#     analysis only ever ran on main after the fact, so it reported
#     problems that were already merged.
#     Caveat worth knowing: this fires for PRs targeting THIS repo's main
#     (dependabot bumps, fork-internal work). PRs opened against
#     NousResearch/hermes-agent run that repo's CI, which has no CodeQL,
#     so those are still not gated from here.
#   - push to main (catches anything landing outside a PR)
#   - weekly cron on Monday 06:00 UTC (picks up new advisories against
#     unchanged code)
#
# Minutes cost -- MEASURED on PR #24, not estimated:
#     actions 47s | c-cpp 51s | javascript-typescript 1m43s
#     python 2m9s | rust 1m56s        => ~7.5 min total runner time
#   The five languages run as parallel matrix jobs, so wall-clock is
#   ~2 min (the slowest leg), well inside the Python test slices at
#   ~3-4 min each. CodeQL is not the critical path on this repo and
#   there is no cost argument for trimming the PR matrix. Re-measure
#   before assuming otherwise.
# Branch protections: the per-push block can be skipped on a docs-only
# change via `[skip ci]` in the commit message.

name: "CodeQL"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: rust
            build-mode: none
          - language: c-cpp
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3b0bd1d116c0bde30213346b22d4f634d96a2fb0  # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3b0bd1d116c0bde30213346b22d4f634d96a2fb0  # v3
        with:
          category: "/language:${{ matrix.language }}"
